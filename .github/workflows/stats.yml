name: Fetch GitHub stats

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      # Gives the real site URL, including a custom domain
      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          INCLUDE_PRIVATE_REPO: ${{ vars.INCLUDE_PRIVATE_REPO || 'false' }}
        run: |
          mkdir -p site
          cp -r web/. site/
          python -m github_stats > site/stats.json

      # Install failures only warn: og.py then writes text-only tags, so stats.json still deploys
      - name: Render social preview
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          pip install -r requirements-og.txt || echo "::warning::Could not install Playwright"
          # --with-deps installs the CJK, Thai and Indic fonts the runner lacks
          python -m playwright install --with-deps --only-shell chromium \
            || echo "::warning::Could not install the preview browser"
          python -m github_stats.og site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # GitHub disables schedules in public repos after 60 days without commits, and this never commits
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/stats.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
