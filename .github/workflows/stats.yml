name: Fetch GitHub stats

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  # Allows running it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once; let an in-progress one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets configure-pages read the site's address from the Pages settings
      pages: read
    steps:
      - uses: actions/checkout@v7

      # Gives the real site URL, including a custom domain if the fork has one
      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          # Repository variable; unset means public repos only
          INCLUDE_PRIVATE_REPO: ${{ vars.INCLUDE_PRIVATE_REPO || 'false' }}
        run: |
          mkdir -p site
          cp -r web/. site/
          python -m github_stats > site/stats.json

      # LinkedIn / Facebook previews don't run JavaScript: render the card to card.png and
      # write og: tags with absolute URLs into index.html.
      # If the tools fail to install or run, og.py still writes text-only tags and exits 0, so the
      # fresh stats.json deploys anyway; only a broken card (profile or avatar) fails this step.
      - name: Render social preview
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          pip install -r requirements-og.txt || echo "::warning::Could not install Playwright"
          # --with-deps also installs the CJK, Thai and Indic fonts the runner lacks; without
          # them, names and bios in those scripts render as empty boxes
          python -m playwright install --with-deps --only-shell chromium \
            || echo "::warning::Could not install the preview browser"
          python -m github_stats.og site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # GitHub disables scheduled workflows in public repos after 60 days without commits, and this
  # workflow never commits. Re-enabling it on every run keeps the weekly schedule alive.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/stats.yml/enable"

  # Publishes the site without committing anything to the repo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
